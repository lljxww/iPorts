name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - name: Validate tag
        run: python3 scripts/release.py validate-tag "$RELEASE_TAG"
      - name: Resolve dependencies
        run: swift package resolve
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive Package.swift src tests scripts/create-icon.swift
      - name: Test application and release validation
        run: |
          swift test
          python3 -m unittest discover -s tests/ReleaseTests -v
          bash -n scripts/build-app.sh scripts/create-release.sh
      - name: Build universal application and sign updates
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Configure the SPARKLE_PRIVATE_KEY repository secret before publishing.' >&2
            exit 1
          fi
          bash scripts/create-release.sh "$RELEASE_TAG"
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/release.py validate-tag "$RELEASE_TAG")"
          release_dir="build/release-$RELEASE_TAG"
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          make_latest="$(python3 scripts/release.py is-latest "$RELEASE_TAG" "$latest_tag")"
          if existing_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$existing_draft" != true ]]; then
              echo 'This version is already published. Create a new version tag instead.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "iPorts $version" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$release_dir/iPorts-$version-macos-universal.zip" \
            "$release_dir/appcast.xml" "$release_dir/SHA256SUMS"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest"
